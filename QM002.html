<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青梅树 QM002 信息</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .info-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .info-row {
            display: flex;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-row:last-child { border-bottom: none; }
        .label { width: 100px; color: #888; font-size: 14px; flex-shrink: 0; }
        .value { color: #333; font-size: 16px; flex: 1; font-weight: 500; }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #4caf50;
        }
        .icon { font-size: 40px; margin-right: 12px; }
        .title { font-size: 20px; font-weight: 600; color: #2e7d32; }
        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 14px;
            background: #4caf50;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .back:hover { background: #388e3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 青梅树信息查询</h1>
        <div class="info-card">
            <div class="header">
                <span class="icon">🌳</span>
                <span class="title">QM002</span>
            </div>
            <div class="info-row">
                <div class="label">类型</div>
                <div class="value">青梅树信息</div>
            </div>
            <div class="info-row">
                <div class="label">科属</div>
                <div class="value">蔷薇科李属</div>
            </div>
            <div class="info-row">
                <div class="label">编号</div>
                <div class="value">QM002</div>
            </div>
            <div class="info-row">
                <div class="label">位置</div>
                <div class="value">A区第三行第二棵</div>
            </div>
            <div class="info-row">
                <div class="label">树龄</div>
                <div class="value">5-20年</div>
            </div>
            <div class="info-row">
                <div class="label">认证</div>
                <div class="value">绿色有机认证</div>
            </div>
        </div>
    </div>
</body>
</html>
