  var STAGE_ICONS = {
    '幼苗期': '<path d="M12 20v-8M12 12c-3 0-6-3-6-7 3 0 6 3 6 7zM12 12c3 0 6-3 6-7-3 0-6 3-6 7zM8 20h8"/>',
    '开花期': '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
    '膨果期': '<circle cx="12" cy="14" r="6"/><path d="M12 8V6M9 4l3 2 3-2"/>',
    '成熟期': '<circle cx="12" cy="14" r="6"/><path d="M12 4v8M9 6l3-2 3 2"/>'
  };
  var DEFAULT_ICON = '<circle cx="12" cy="12" r="6"/>';
  var TREE_ICON = '<path d="M12 2v6M8 8l4-3 4 3M5 14c0-3 3-6 7-6s7 3 7 6v4c0 1-1 2-2 2H7c-1 0-2-1-2-2v-4zM12 20v2"/>';
  var LOCK_ICON = '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>';

  function svg(pathHtml, cls) {
    return '<svg class="' + (cls || 'icon') + '" viewBox="0 0 24 24" aria-hidden="true">' + pathHtml + '</svg>';
  }
  function stageIcon(key, cls) {
    return svg(STAGE_ICONS[key] || DEFAULT_ICON, cls);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // 快照模式下把 /assets、/uploads 转为相对路径
  function resolveSrc(p) {
    if (window.__ARCHIVE__ && typeof p === 'string' && p.charAt(0) === '/') return p.slice(1);
    return p;
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function startClock() {
    var el = document.getElementById('beijingTime');
    if (!el) return;
    function tick() {
      var now = new Date();
      var bj = new Date(now.getTime() + (now.getTimezoneOffset() + 480) * 60000);
      el.textContent = bj.getFullYear() + '-' + pad(bj.getMonth() + 1) + '-' + pad(bj.getDate()) +
        ' ' + pad(bj.getHours()) + ':' + pad(bj.getMinutes()) + ':' + pad(bj.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  }

  function noImageHtml(key) {
    return '<div class="no-image">' + stageIcon(key) + '<span>暂无影像</span></div>';
  }

  /* ---------------- 图库 ---------------- */
  function initGallery(root, images, stageKey) {
    var idx = 0;
    var imgEl = root.querySelector('img');
    var countEl = root.querySelector('.gallery-count');
    var dotsEl = root.querySelector('.gallery-dots');

    function show(i) {
      idx = (i + images.length) % images.length;
      if (imgEl) {
        imgEl.src = resolveSrc(images[idx]);
      }
      if (countEl) countEl.textContent = (idx + 1) + ' / ' + images.length;
      if (dotsEl) {
        var dots = dotsEl.querySelectorAll('i');
        for (var k = 0; k < dots.length; k++) dots[k].className = k === idx ? 'on' : '';
      }
    }

    if (imgEl) {
      imgEl.addEventListener('error', function onErr() {
        imgEl.removeEventListener('error', onErr);
        var ph = document.createElement('div');
        ph.innerHTML = noImageHtml(stageKey);
        imgEl.replaceWith(ph.firstChild);
      });
    }
    var prev = root.querySelector('.gallery-nav.prev');
    var next = root.querySelector('.gallery-nav.next');
    if (prev) prev.addEventListener('click', function () { show(idx - 1); });
    if (next) next.addEventListener('click', function () { show(idx + 1); });
    if (dotsEl) {
      dotsEl.addEventListener('click', function (e) {
        if (e.target.tagName === 'I') show(Number(e.target.getAttribute('data-i')));
      });
    }
  }

  /* ---------------- 渲染 ---------------- */
  function renderUnpublished(app, id) {
    app.innerHTML =
      '<div class="bg-layer" aria-hidden="true"></div>' +
      '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>' +
      '<div class="state-screen">' +
      svg(LOCK_ICON, 'big-icon') +
      '<div class="id-chip">' + esc(id) + '</div>' +
      '<h2>档案未下发</h2>' +
      '<p>ARCHIVE_NOT_PUBLISHED · 该溯源档案尚未下发，请扫描有效二维码或联系管理人员</p>' +
      '</div>';
  }

  function renderError(app, id, msg) {
    app.innerHTML =
      '<div class="bg-layer" aria-hidden="true"></div>' +
      '<div class="state-screen">' +
      '<div class="id-chip">' + esc(id) + '</div>' +
      '<h2>档案加载失败</h2>' +
      '<p>' + esc(msg || 'NETWORK_ERROR') + '</p>' +
      '</div>';
  }

  function render(app, a) {
    var stages = a.stages || [];
    var curIdx = Math.max(0, stages.findIndex(function (s) { return s.key === a.currentStage; }));
    var n = stages.length;
    var pos = stages.map(function (_, i) { return n <= 1 ? 50 : 15 + i * (70 / (n - 1)); });

    var totalImgs = stages.reduce(function (sum, s) { return sum + s.images.length; }, 0);
    var filled = stages.filter(function (s) { return s.images.length > 0; }).length;
    var completeness = n ? Math.round((filled / n) * 100) : 0;

    /* info 分两行渲染（前 5 个 + 其余） */
    function infoCells(list) {
      return list.map(function (it) {
        var cls = it.tone ? ' ' + esc(it.tone) : '';
        return '<div class="info-cell"><div class="label">' + esc(it.label) + '</div>' +
          '<div class="value' + cls + '">' + esc(it.value) + '</div></div>';
      }).join('');
    }
    var info = a.info || [];
    var infoRow1 = infoCells(info.slice(0, 5));
    var infoRow2 = info.length > 5 ? '<div class="info-grid">' + infoCells(info.slice(5)) + '</div>' : '';

    /* 时间轴节点 */
    var nodes = stages.map(function (s, i) {
      var state = i < curIdx ? 'passed' : (i === curIdx ? 'current' : 'future');
      var stateText = i < curIdx ? '已完成' : (i === curIdx ? '进行中' : '未到');
      return '<button class="timeline-node ' + state + '" type="button" style="left:' + pos[i].toFixed(1) + '%;" ' +
        'data-stage="' + esc(s.key) + '" aria-label="' + esc(s.key) + '：' + stateText + '">' +
        stageIcon(s.key, 'node-icon') +
        '<span class="node-dot" aria-hidden="true"></span>' +
        '<span class="node-label">' + esc(s.key) + '</span></button>';
    }).join('');
    var progressWidth = Math.max(0, pos[curIdx] - 5);

    /* 阶段卡片 */
    var cards = stages.map(function (s, i) {
      var isCur = i === curIdx;
      var gallery;
      if (s.images.length) {
        var dots = s.images.length > 1
          ? '<div class="gallery-dots">' + s.images.map(function (_, k) {
              return '<i data-i="' + k + '"' + (k === 0 ? ' class="on"' : '') + '></i>';
            }).join('') + '</div>'
          : '';
        var nav = s.images.length > 1
          ? '<button class="gallery-nav prev" type="button" aria-label="上一张">‹</button>' +
            '<button class="gallery-nav next" type="button" aria-label="下一张">›</button>'
          : '';
        var count = s.images.length > 1 ? '<div class="gallery-count">1 / ' + s.images.length + '</div>' : '';
        gallery =
          '<img src="' + esc(resolveSrc(s.images[0])) + '" alt="' + esc(s.key) + '影像" loading="lazy" decoding="async">' +
          nav + dots + count;
      } else {
        gallery = noImageHtml(s.key);
      }
      return '<article class="stage-card" data-stage="' + esc(s.key) + '" id="stage-' + i + '" style="animation-delay:' + (0.8 + i * 0.1).toFixed(1) + 's">' +
        '<header class="stage-header">' + stageIcon(s.key, 'stage-icon') +
        '<div class="stage-info"><div class="stage-name">' + esc(s.key) + '</div>' +
        '<div class="stage-id-tag">' + esc(s.tag) + '</div></div>' +
        (isCur ? '<span class="stage-live">● 当前</span>' : '') +
        '</header>' +
        '<div class="stage-image-area" data-gallery="' + i + '">' + gallery + '</div>' +
        '<div class="stage-meta"><span>影像数量：' + s.images.length + ' 张</span><span>更新：' + esc(s.updated || '—') + '</span></div>' +
        '<p class="stage-desc">' + esc(s.desc) + '</p>' +
        '</article>';
    }).join('');

    var syncText = (a.updatedAt || '').slice(0, 10) || '—';
    var cert = (info.find(function (it) { return it.label === '认证'; }) || { value: '绿色有机' }).value.replace(/^[◆\s]+/, '');

    app.innerHTML =
      '<div class="bg-layer" aria-hidden="true"></div>' +
      '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>' +
      '<div class="container">' +

      '<header class="header"><div class="header-left">' +
      '<div class="data-block-id">// DATA_BLOCK_01</div>' +
      '<h1 class="main-title">' + esc(a.title || '青梅树溯源档案') + '</h1></div>' +
      '<div class="time-display" aria-label="系统时间"><div class="time-label">系统时间</div>' +
      '<div class="time-value" id="beijingTime">--</div></div></header>' +

      '<div class="status-bar">' +
      '<div class="status-item"><span class="status-dot"></span><span>系统在线</span></div>' +
      '<div class="status-item"><span class="status-dot"></span><span>数据同步：' + esc(syncText) + '</span></div>' +
      '<div class="status-item"><span class="diamond">◆</span><span style="color:var(--neon-yellow);">' + esc(cert) + '</span></div>' +
      '<div class="status-item"><span style="color:var(--neon-green);">已下发</span><span class="status-dot"></span></div>' +
      '</div>' +

      '<div class="tree-id-badge">' + svg(TREE_ICON) + '<span>' + esc(a.id) + '</span></div>' +

      '<section class="info-panel" data-tag="// INFO_PANEL_' + esc(a.id) + '">' +
      '<div class="info-grid">' + infoRow1 + '</div>' + infoRow2 +
      '</section>' +

      '<section class="timeline-section">' +
      '<div class="timeline-header"><div class="timeline-title">// 生长周期时间轴</div>' +
      '<div class="live-indicator"><span class="live-dot"></span><span>实时监测中</span></div></div>' +
      '<div class="timeline-track"><div class="timeline-line"></div>' +
      '<div class="timeline-progress" style="width:' + progressWidth.toFixed(1) + '%;"></div>' +
      nodes + '</div></section>' +

      '<section class="stages-grid">' + cards + '</section>' +

      '<section class="stats-row">' +
      '<div class="stat-cell"><div class="stat-value">' + n + '</div><div class="stat-label">生长周期</div></div>' +
      '<div class="stat-cell"><div class="stat-value">' + totalImgs + '</div><div class="stat-label">影像总数</div></div>' +
      '<div class="stat-cell"><div class="stat-value">' + (n - filled) + '</div><div class="stat-label">待补充</div></div>' +
      '<div class="stat-cell"><div class="stat-value">' + completeness + '<span style="font-size:0.6em;">%</span></div><div class="stat-label">档案完整度</div></div>' +
      '</section>' +

      '<footer class="footer"><span>TRACE_ID:</span> ' + esc(a.trace && a.trace.id) +
      ' · <span>HASH:</span> ' + esc(a.trace && a.trace.hash) +
      ' · <span>VER:</span> ' + esc(a.trace && a.trace.ver) + '</footer>' +
      '</div>';

    /* 交互：时间轴点击滚动到阶段卡 */
    app.querySelectorAll('.timeline-node').forEach(function (node) {
      node.addEventListener('click', function () {
        var key = node.getAttribute('data-stage');
        var card = app.querySelector('.stage-card[data-stage="' + key + '"]');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });

    /* 交互：图库 */
    app.querySelectorAll('.stage-image-area[data-gallery]').forEach(function (area) {
      var i = Number(area.getAttribute('data-gallery'));
      if (stages[i] && stages[i].images.length) initGallery(area, stages[i].images, stages[i].key);
    });

    startClock();
  }

  /* ---------------- 启动 ---------------- */
  var app = document.getElementById('app');
  var id = window.TREE_ID;

  if (window.__ARCHIVE__) {
    if (window.__ARCHIVE__.published === false) renderUnpublished(app, id);
    else render(app, window.__ARCHIVE__);
  } else {
    fetch('/api/public/archives/' + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.published === false) renderUnpublished(app, id);
        else if (data && data.id) render(app, data);
        else renderError(app, id, data && data.message);
      })
      .catch(function (e) { renderError(app, id, e.message); });
  }
})();

  </script>
</body>
</html>
